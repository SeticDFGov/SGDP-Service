name: Apply Database Migrations

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - 'app/Migrations/**'

jobs:
  apply-migrations:
    runs-on: self-hosted

    steps:
    - name: Checkout do código
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Adicionar .NET ao PATH
      run: |
        echo "/usr/share/dotnet" >> $GITHUB_PATH
        echo "$HOME/.dotnet/tools" >> $GITHUB_PATH
        echo "DOTNET_ROOT=/usr/share/dotnet" >> $GITHUB_ENV

    - name: Verificar versão do .NET
      run: dotnet --version

    - name: Restore dependencies
      working-directory: ./app
      run: dotnet restore

    - name: Install EF Core tools
      run: |
        export PATH="$PATH:$HOME/.dotnet/tools"
        dotnet tool install --global dotnet-ef || dotnet tool update --global dotnet-ef

    - name: Build project
      working-directory: ./app
      run: dotnet build --no-restore --configuration Release

    - name: Verificar dotnet-ef
      run: |
        which dotnet-ef || echo "dotnet-ef não encontrado no PATH"
        dotnet ef --version || echo "dotnet ef falhou"
        echo "PATH: $PATH"
        echo "DOTNET_ROOT: $DOTNET_ROOT"

    - name: Apply migrations to database
      working-directory: ./app
      run: dotnet ef database update --connection "${{ secrets.DATABASE_CONNECTION_STRING }}" --verbose
      env:
        ASPNETCORE_ENVIRONMENT: Production
