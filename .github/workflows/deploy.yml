name: Build and push image

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# Deploys da main entram em fila (nunca dois ao mesmo tempo); builds de PR
# antigos do mesmo branch são cancelados.
concurrency:
  group: deploy-${{ github.event_name == 'push' && 'main' || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE_NAME: gede-api
  # Imagens no GitHub Container Registry da organização (ghcr.io/seticdfgov/*), públicas.
  MANIFEST: backend/deployment.yaml

jobs:
  build:
    runs-on: ubuntu-latest
    # packages: write deixa o GITHUB_TOKEN publicar no GHCR (sem segredo guardado).
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout do código
      uses: actions/checkout@v4

    - name: Set Image Tag
      run: |
        echo "IMAGE_TAG=${GITHUB_SHA::7}" >> $GITHUB_ENV
        echo "IMAGE=ghcr.io/seticdfgov/${IMAGE_NAME}:${GITHUB_SHA::7}" >> $GITHUB_ENV

    # Em PR só valida o build; imagem e manifesto só saem da main.
    - name: Build da imagem
      # A label liga a imagem a este repositório (aparece em Packages e herda o acesso dele).
      run: |
        docker build -f Dockerfile.prod \
          --label "org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}" \
          -t "$IMAGE" .

    - name: Login no GitHub Container Registry
      if: github.event_name == 'push'
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Push da imagem
      if: github.event_name == 'push'
      run: docker push "$IMAGE"

    # O cluster baixa sem credencial. Se o pacote não for público (todo pacote novo nasce
    # privado), o deploy para aqui e o manifesto não muda: produção segue na imagem atual.
    - name: Conferir que a imagem baixa sem login
      if: github.event_name == 'push'
      run: |
        REPO="seticdfgov/${IMAGE_NAME}"
        # Pacote privado já recusa o token anônimo; sem "|| true" o pipefail encerraria antes do aviso.
        TOKEN=$(curl -fsS "https://ghcr.io/token?scope=repository:${REPO}:pull" | jq -r '.token // empty' || true)
        if ! curl -fsS -o /dev/null -H "Authorization: Bearer ${TOKEN}" \
             -H "Accept: application/vnd.oci.image.index.v1+json,application/vnd.oci.image.manifest.v1+json,application/vnd.docker.distribution.manifest.v2+json" \
             "https://ghcr.io/v2/${REPO}/manifests/${IMAGE_TAG}"; then
          echo "::error::A imagem ${IMAGE} não baixa sem login. Torne o pacote público em ${{ github.server_url }}/orgs/SeticDFGov/packages/container/package/${IMAGE_NAME} (Package settings > Change visibility) e rode este workflow de novo."
          exit 1
        fi

    # O ArgoCD (auto-sync) aplica o que estiver no k8s-manifests; o push aqui é o deploy.
    - name: Update deployment manifest
      if: github.event_name == 'push'
      run: |
        git config --global user.email "ci@example.com"
        git config --global user.name "CI Bot"

        git clone --depth 1 https://${{ secrets.GH_TOKEN }}@github.com/SeticDFGov/k8s-manifests.git
        cd k8s-manifests

        yq eval ".spec.template.spec.containers[0].image = \"$IMAGE\"" -i "$MANIFEST"

        if git diff --quiet; then
          echo "Manifesto já aponta para $IMAGE"; exit 0
        fi

        git add "$MANIFEST"
        git commit -m "deploy: update ${IMAGE_NAME} to ${IMAGE_TAG}" \
          -m "Origem: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}"

        # Front e back escrevem no mesmo repo; se o outro empurrou antes, rebase e tenta de novo.
        for i in 1 2 3 4 5; do
          git push origin main && exit 0
          sleep $((i * 3))
          git pull --rebase origin main
        done
        echo "Falha ao enviar o manifesto após 5 tentativas"; exit 1
