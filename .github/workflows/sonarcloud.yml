name: SonarCloud Analysis

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
    types: [ opened, synchronize, reopened ]

jobs:
  sonarcloud:
    # Runner hospedado pelo GitHub: ambiente isolado e recriado do zero a cada
    # execução (nada compartilhado com a máquina do self-hosted, que faltava
    # Java e travava o scanner com SIGABRT).
    runs-on: ubuntu-latest

    steps:
    - name: Checkout do código
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Instalar .NET 8
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Instalar Java (exigido pelo scanner)
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Instalar dotnet-sonarscanner
      run: dotnet tool install --global dotnet-sonarscanner

    - name: Iniciar análise do SonarCloud
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      run: |
        dotnet-sonarscanner begin \
          /k:"SeticDFGov_SGDP-Service" \
          /o:"seticdfgov" \
          /d:sonar.token="${{ secrets.SONAR_TOKEN }}" \
          /d:sonar.host.url="https://sonarcloud.io" \
          /d:sonar.exclusions="**/Migrations/**,**/bin/**,**/obj/**"

    - name: Restore dependencies
      run: dotnet restore app/demanda_service.sln

    - name: Build
      run: dotnet build app/demanda_service.sln --no-restore --configuration Release

    - name: Finalizar análise do SonarCloud
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      run: dotnet-sonarscanner end /d:sonar.token="${{ secrets.SONAR_TOKEN }}"
