name: SonarCloud Analysis

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
    types: [ opened, synchronize, reopened ]

jobs:
  sonarcloud:
    # Runner hospedado pelo GitHub: ambiente isolado e recriado do zero a cada
    # execução (nada compartilhado com a máquina do self-hosted, que faltava
    # Java e travava o scanner com SIGABRT).
    runs-on: ubuntu-latest

    steps:
    - name: Checkout do código
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Instalar .NET 8
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Instalar Java (exigido pelo scanner)
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Instalar dotnet-sonarscanner
      run: dotnet tool install --global dotnet-sonarscanner

    - name: Iniciar análise do SonarCloud
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      run: |
        dotnet-sonarscanner begin \
          /k:"SeticDFGov_SGDP-Service" \
          /o:"seticdfgov" \
          /d:sonar.token="${{ secrets.SONAR_TOKEN }}" \
          /d:sonar.host.url="https://sonarcloud.io" \
          /d:sonar.exclusions="**/Migrations/**,**/bin/**,**/obj/**" \
          /d:sonar.cs.opencover.reportsPaths="**/coverage.opencover.xml"

    - name: Restore dependencies
      run: |
        dotnet restore app/demanda_service.sln
        dotnet restore test-pgia/test-pgia.csproj
        dotnet restore test-contratacoes/test-contratacoes.csproj

    # Build dos projetos de teste (além do app) é o que faz o MSBuild integration
    # do scanner reconhecer demanda_service como projeto MAIN corretamente — sem
    # isso o scanner só via ProjectInfo de TEST e descartava a cobertura inteira
    # ("detected only TEST files and no MAIN files").
    - name: Build
      run: |
        dotnet build app/demanda_service.sln --no-restore --configuration Release
        dotnet build test-pgia/test-pgia.csproj --no-restore --configuration Release
        dotnet build test-contratacoes/test-contratacoes.csproj --no-restore --configuration Release

    # Cobertura dos dois projetos de teste (test/ é o legado que não compila, fora
    # do escopo). O relatório é o que dotnet-sonarscanner end lê para publicar a
    # cobertura no dashboard do SonarCloud.
    - name: Testes com cobertura (test-pgia)
      run: >
        dotnet test test-pgia/test-pgia.csproj
        --no-build --no-restore --configuration Release
        --collect:"XPlat Code Coverage"
        --results-directory test-pgia/TestResults
        -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=opencover

    - name: Testes com cobertura (test-contratacoes)
      run: >
        dotnet test test-contratacoes/test-contratacoes.csproj
        --no-build --no-restore --configuration Release
        --collect:"XPlat Code Coverage"
        --results-directory test-contratacoes/TestResults
        -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=opencover

    - name: Finalizar análise do SonarCloud
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      run: dotnet-sonarscanner end /d:sonar.token="${{ secrets.SONAR_TOKEN }}"
